[project]
name = "backend"
version = "0.1.0"
requires-python = ">=3.13.15"
dependencies = [
    "alembic>=1.19.1",
    "argon2-cffi>=25.1.0",
    "cryptography>=46.0.0",
    "defusedxml>=0.7.1",
    "fastapi[standard]>=0.141.1",
    "openpyxl>=3.1.5",
    "pillow>=12.3.0",
    "psycopg[binary]>=3.3.4",
    "pydantic-settings>=2.15.0",
    "python-multipart>=0.0.20,<0.1",
    "sqlalchemy>=2.0.52",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.4",
]

[tool.pytest.ini_options]
pythonpath = ["."]
